<button type="button" class="fab-trigger" id="fab-trigger" aria-label="快速记账">+
</button>

<section class="fab-panel" id="fab-panel" aria-hidden="true">
  <div class="fab-panel-head">
    <h2>快速记账</h2>
    <button type="button" class="fab-close" id="fab-close" aria-label="关闭">×</button>
  </div>
  <div class="small" style="margin-bottom: 10px;">保持原有录入方式不变，只有在需要报销追踪时才补充下面的关联字段。</div>

  <form id="fab-transaction-form" class="fab-form">
    <div>
      <label class="small" for="fab-amount">金额</label>
      <input id="fab-amount" type="number" step="0.01" min="0.01" name="amount" placeholder="金额" required />
    </div>

    <div>
      <label class="small" for="fab-type">类型</label>
      <select id="fab-type" name="type">
        <option value="expense" selected>支出</option>
        <option value="income">收入</option>
      </select>
    </div>

    <div id="fab-expense-category-main">
      <label class="small" for="fab-category-main">主类别</label>
      <select id="fab-category-main" name="category_main" required>
        <option value="">请选择主类别</option>
        {% for category in fab_category_options %}
        <option value="{{ category }}">{{ category }}</option>
        {% endfor %}
      </select>
    </div>

    <div id="fab-expense-category-sub">
      <label class="small" for="fab-category-sub">子类别</label>
      <input id="fab-category-sub" type="text" name="category_sub" placeholder="如：外卖 / 奶茶 / 书籍" />
    </div>

    <div id="fab-expense-tags">
      <label class="small" for="fab-tags">标签（可多选）</label>
      <select id="fab-tags" name="tags" multiple>
        {% for tag in fab_tag_options %}
        <option value="{{ tag }}">{{ tag }}</option>
        {% endfor %}
      </select>
      <div class="small" style="margin-top: 4px;">按住 Ctrl(Windows) 可多选</div>
    </div>

    <div id="fab-expense-reimbursement-box">
      <label class="small" style="display: flex; align-items: center; gap: 8px;">
        <input id="fab-is-reimbursable" type="checkbox" name="is_reimbursable" value="1" />
        <span>标记为待报销</span>
      </label>
      <div class="small" style="margin-top: 4px;">勾选后，该笔支出会进入报销追踪列表。</div>
    </div>

    <div id="fab-expense-reimbursement-amount" style="display: none;">
      <label class="small" for="fab-reimbursement-target-amount">待报销金额</label>
      <input id="fab-reimbursement-target-amount" type="number" step="0.01" min="0.01" name="reimbursement_target_amount" placeholder="默认等于支出金额" />
    </div>

    <div id="fab-income-source" style="display: none;">
      <label class="small" for="fab-income-source-input">收入来源</label>
      <input id="fab-income-source-input" type="text" name="income_source" placeholder="如：工资 / 奖金 / 兼职 / 报销" />
      <div class="small" style="margin-top: 4px;">报销到账请填写“报销”，系统会开启关联支出选项。</div>
    </div>

    <div id="fab-income-reimbursement-link" style="display: none;">
      <label class="small" for="fab-reimbursement-expense-select">关联待报销支出</label>
      <select id="fab-reimbursement-expense-select" name="reimbursement_expense_transaction_id">
        <option value="">不关联</option>
        {% for expense in fab_open_reimbursement_expenses %}
        <option value="{{ expense.id }}" data-pending-amount="{{ '%.2f'|format(expense.pending_amount) }}">
          {{ expense.date }} · {{ expense.category_main }}{% if expense.category_sub %}/{{ expense.category_sub }}{% endif %} · 待报销 ¥{{ '%.2f'|format(expense.pending_amount) }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div id="fab-income-reimbursement-amount" style="display: none;">
      <label class="small" for="fab-reimbursement-link-amount">本次关联金额</label>
      <input id="fab-reimbursement-link-amount" type="number" step="0.01" min="0.01" name="reimbursement_link_amount" placeholder="默认等于本次报销收入" />
    </div>

    <div>
      <label class="small" for="fab-note">备注（可选）</label>
      <input id="fab-note" type="text" name="note" placeholder="备注（可选）" />
    </div>

    <div>
      <label class="small" for="fab-date">日期</label>
      <input id="fab-date" type="date" name="date" value="{{ fab_today }}" />
    </div>

    <div class="fab-actions">
      <span class="small fab-message" id="fab-message"></span>
      <button class="btn" type="submit" id="fab-submit">记一笔</button>
    </div>
  </form>
</section>
